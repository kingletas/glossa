[project]
name = "glossa"
dynamic = ["version"]
description = "The Obsidian dialect rendered read-only in pure Python: Markdown, links, Dataview, Bases, canvases, boards and drawings"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Luis Tineo", email = "code@kingletas.com" }]
requires-python = ">=3.12"
# A bare install is the standard library alone, enough for the palettes, list
# diffs, fuzzy matching, Dataview and the drawings. Parsing Markdown and reading
# YAML (`markdown`, `frontmatter`, `bases`) take the `render` extra.
dependencies = []

[project.optional-dependencies]
render = [
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "linkify-it-py>=2.2.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "glossa[render]",
]

[tool.hatch.version]
path = "src/glossa/__init__.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glossa"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = [
    # S101: pytest asserts are the house test style.
    "S101",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
