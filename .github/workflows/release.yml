name: Release

# Tagging is the whole trigger: `git tag v1.2.3 && git push --tags` checks the
# changelog has a section for it, then publishes a GitHub Release whose body is
# that section. Run by hand, it tests and releases the branch it is run from,
# not the tag the typed version names, so run it from that tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 1.2.3)"
        required: true

permissions:
  contents: read

jobs:
  # The tests install packages from PyPI and run their code, so they run with a
  # read-only token that is not kept in the checkout.
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Work out which version this is
        id: pick
        # The typed version reaches the shell as a variable, never pasted into
        # the script, so it can't run as code.
        env:
          EVENT: ${{ github.event_name }}
          TYPED: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="$TYPED"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          # Anything but a plain version, a newline above all, could write a
          # second line into the step's outputs.
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a version: $version"; exit 1; }
          # A release with no notes is one nobody can read, so this stops here
          # rather than publishing an empty body.
          packaging/release-notes.sh "$version" > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A release nobody proved is a release nobody should trust: the tagged
      # commit is installed into a clean environment and its tests run there.
      - name: Install the tagged commit and run its tests
        run: |
          python3 -m venv .release-venv
          .release-venv/bin/pip install --quiet -c .github/ci-requirements.txt ".[render]" pytest
          .release-venv/bin/python -m pytest -q

  # Only this job can write, and it installs nothing: it reads the changelog and
  # calls gh.
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          version="$VERSION"
          packaging/release-notes.sh "$version" > notes.md
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "v${version} exists: updating its notes"
            gh release edit "v${version}" --title "glossa ${version}" --notes-file notes.md
          else
            gh release create "v${version}" --target "$GITHUB_SHA" \
              --title "glossa ${version}" --notes-file notes.md
          fi
